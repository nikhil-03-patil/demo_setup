<!DOCTYPE html>
<html>
<head>
    <title>Salary Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Salary Prediction App</h1>
        <p>Enter your details to predict your annual salary:</p>
        
        <form action="/predict" method="post">
            <div class="form-group">
                <label for="years_experience">Years of Experience:</label>
                <input type="number" step="0.5" min="0" max="20" id="years_experience" name="years_experience" required>
            </div>
            
            <div class="form-group">
                <label for="education">Education Level:</label>
                <select id="education" name="education" required>
                    <option value="Bachelors">Bachelor's Degree</option>
                    <option value="Masters">Master's Degree</option>
                    <option value="PhD">PhD</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="role">Job Role:</label>
                <select id="role" name="role" required>
                    <option value="Software Developer">Software Developer</option>
                    <option value="Data Scientist">Data Scientist</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="city_tier">City Tier:</label>
                <select id="city_tier" name="city_tier" required>
                    <option value="1">Tier 1 (Metro City)</option>
                    <option value="2">Tier 2 (Smaller City)</option>
                </select>
            </div>
            
            <input type="submit" value="Predict Salary">
        </form>
    </div>
</body>
</html>
